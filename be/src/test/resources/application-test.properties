spring.datasource.url=jdbc:h2:mem:focus_recovery;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
# H2는 DATETIME(3)을 TIMESTAMP로 보고하므로 validate 통과를 위해 Instant를 TIMESTAMP로 매핑한다 (jdbc.time_zone=UTC라 저장 값은 동일)
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
# 테스트에서 실제 AI 서버로 나가지 않도록 연결이 즉시 거부되는 주소를 쓴다(모의 서버 테스트는 이 값을 덮어쓴다)
focus-recovery.ai.base-url=http://127.0.0.1:1
